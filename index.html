<!doctype html>
<html lang="ja">
<head>

<style>
  :root { color-scheme: dark; --ink: #17102b; --yel: #ffe14a; --red: #ff3b3b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #140c2a; color: #fff; overscroll-behavior: none;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  button { font: inherit; font-weight: 900; cursor: pointer; touch-action: manipulation; color: var(--ink); }
  .hidden { display: none !important; }
  .stroke { -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; }

  /* ---- 遊んでいる間の表示 ---- */
  #hud { position: fixed; inset: 0; pointer-events: none; padding: calc(env(safe-area-inset-top) + 8px) 10px 0; }
  #hudTop { display: flex; align-items: center; gap: 8px; }
  .ibtn { pointer-events: auto; width: 44px; height: 44px; flex: none; border-radius: 50%; border: 3px solid var(--ink); background: #fff; font-size: 18px; padding: 0; box-shadow: 0 3px 0 var(--ink); }
  #timeWrap { flex: 1; height: 26px; border: 3px solid var(--ink); border-radius: 999px; background: rgba(20,12,42,.75); position: relative; overflow: hidden; box-shadow: 0 3px 0 var(--ink); }
  #timeBar { position: absolute; inset: 0; transform-origin: left center; background: linear-gradient(90deg, #44e08a, #d6f24a); }
  #timeWrap.hot #timeBar { background: linear-gradient(90deg, #ff3b3b, #ff9a3b); }
  #timeNum { position: absolute; inset: 0; text-align: center; font-weight: 900; font-size: 16px; line-height: 20px; text-shadow: 0 0 4px #000, 0 1px 0 #000; }
  #hits { margin-top: 6px; text-align: center; font-weight: 900; line-height: 1; color: var(--yel); font-size: clamp(54px, 17vw, 96px); text-shadow: 0 5px 0 var(--red); will-change: transform; }
  #hits small { font-size: .36em; margin-left: 4px; color: #fff; text-shadow: none; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
  #hits.bump { animation: bump .16s ease-out; }
  @keyframes bump { 0% { transform: scale(1.32) rotate(-3deg); } 100% { transform: scale(1); } }
  #combo { text-align: center; font-weight: 900; font-size: clamp(20px, 6.2vw, 34px); color: #fff; height: 1.3em; opacity: 0; transform-origin: center; }
  #combo.on { opacity: 1; } #combo.bump { animation: bump .18s ease-out; }
  #combo b { color: #ff7ad1; font-size: 1.35em; }
  #foe { position: absolute; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 8px); display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 13px; }
  #foeName { flex: none; max-width: 46%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--ink); padding: 4px 10px; border-radius: 999px; }
  #gaugeWrap { flex: 1; height: 16px; border: 3px solid var(--ink); border-radius: 999px; background: rgba(20,12,42,.75); overflow: hidden; position: relative; }
  #gauge { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0); background: linear-gradient(90deg, #ffb13b, #ff3b6b); }
  #gaugeWrap::after { content: "ダウンまで"; position: absolute; inset: 0; text-align: center; font-size: 10px; line-height: 10px; text-shadow: 0 0 3px #000; }
  #gaugeWrap.full { animation: shake .12s linear infinite; }
  @keyframes shake { 0% { transform: translate(1px, 0); } 50% { transform: translate(-1px, 1px); } 100% { transform: translate(1px, -1px); } }

  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; font-weight: 900; white-space: nowrap; transform: translate(-50%, -50%); animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) forwards; will-change: transform, opacity; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
  .pop.head { color: var(--yel); font-size: clamp(30px, 10vw, 54px); }
  .pop.body { color: #fff; font-size: clamp(24px, 8vw, 42px); }
  .pop.miss { color: #b9c0d0; font-size: clamp(16px, 5vw, 24px); -webkit-text-stroke: 4px var(--ink); animation-duration: .45s; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(var(--r)); } 25% { opacity: 1; transform: translate(-50%, -62%) scale(1.25) rotate(var(--r)); } 70% { opacity: 1; transform: translate(-50%, -85%) scale(1) rotate(var(--r)); } 100% { opacity: 0; transform: translate(-50%, -130%) scale(.9) rotate(var(--r)); } }
  #flash { position: fixed; inset: 0; pointer-events: none; background: #fff; opacity: 0; }
  #big { position: fixed; left: 0; right: 0; top: 25%; text-align: center; pointer-events: none; font-weight: 900; font-size: clamp(34px, 11.5vw, 76px); color: #fff; line-height: 1.15; padding: 0 8px; }
  #big.go { animation: big .95s cubic-bezier(.2, 1.5, .4, 1) forwards; }
  #big.red { color: var(--red); -webkit-text-stroke-color: #fff; } #big.yel { color: var(--yel); }
  @keyframes big { 0% { opacity: 0; transform: scale(.2) rotate(-8deg); } 18% { opacity: 1; transform: scale(1.18) rotate(-4deg); } 30% { transform: scale(1) rotate(-4deg); } 80% { opacity: 1; transform: scale(1.04) rotate(-4deg); } 100% { opacity: 0; transform: scale(1.3) rotate(-4deg); } }
  #bubble { position: fixed; pointer-events: none; transform: translate(-50%, -100%); background: #fff; color: var(--ink); font-weight: 900; font-size: clamp(14px, 4.2vw, 19px); padding: 8px 14px; border: 3px solid var(--ink); border-radius: 18px; max-width: 78vw; text-align: center; box-shadow: 0 4px 0 var(--ink); opacity: 0; transition: opacity .12s; line-height: 1.35; }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -13px; margin-left: -9px; border: 9px solid transparent; border-top: 12px solid var(--ink); border-bottom: 0; }
  #bubble.on { opacity: 1; }
  #bubble.boss { background: #f3e2ff; }

  /* ---- 重なる画面 ---- */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 22px); background: rgba(16, 9, 36, .8); }
  .overlay.mid { justify-content: center; gap: 14px; }
  h1.logo { margin: 4px 0 0; font-size: clamp(50px, 17vw, 92px); font-weight: 900; color: var(--yel); line-height: 1.05; transform: rotate(-4deg); text-shadow: 6px 7px 0 var(--red); letter-spacing: .02em; }
  .sub { margin: 10px 0 2px; font-weight: 900; font-size: clamp(15px, 4.6vw, 20px); }
  .note { margin: 2px 0 10px; font-size: 12px; opacity: .78; line-height: 1.6; }
  #grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 560px; }
  @media (min-width: 760px) { #grid { grid-template-columns: repeat(5, 1fr); max-width: 1080px; } }
  .card { position: relative; display: flex; flex-direction: column; align-items: stretch; padding: 0 0 8px; border: 3px solid var(--ink); border-radius: 16px; background: #fff; color: var(--ink); box-shadow: 0 5px 0 var(--ink); overflow: hidden; text-align: left; transition: transform .08s; }
  .card:active { transform: translateY(4px) scale(.98); box-shadow: 0 1px 0 var(--ink); }
  .card img { width: 100%; aspect-ratio: 1 / 0.82; object-fit: cover; display: block; background: #ccd; border-bottom: 3px solid var(--ink); }
  .card .nm { font-size: 14px; font-weight: 900; padding: 6px 8px 0; line-height: 1.25; }
  .card .kt { font-size: 10.5px; font-weight: 700; padding: 2px 8px 0; opacity: .7; line-height: 1.35; min-height: 2.7em; }
  .card .row { display: flex; justify-content: space-between; align-items: center; padding: 3px 8px 0; font-size: 11px; font-weight: 900; }
  .card .spd { color: #ff7a00; letter-spacing: -1px; } .card .spd i { color: #d6d6e0; font-style: normal; }
  .card .best { color: #c2185b; }
  .card.boss { grid-column: 1 / -1; flex-direction: row; background: #2a1140; color: #fff; border-color: #ffe14a; box-shadow: 0 5px 0 #ffe14a; padding: 0; }
  .card.boss img { width: 42%; aspect-ratio: 1 / 0.9; border-bottom: 0; border-right: 3px solid #ffe14a; }
  .card.boss .txt { flex: 1; padding: 8px 4px 8px 2px; display: flex; flex-direction: column; justify-content: center; }
  .card.boss .nm { font-size: 17px; } .card.boss .kt { opacity: .85; font-size: 12px; } .card.boss .best { color: #ffe14a; }
  .tag { position: absolute; left: 6px; top: 6px; background: var(--red); color: #fff; font-size: 11px; font-weight: 900; padding: 2px 8px; border-radius: 999px; border: 2px solid var(--ink); }
  .num { position: absolute; right: 6px; top: 6px; background: var(--yel); color: var(--ink); font-size: 11px; font-weight: 900; width: 24px; height: 24px; line-height: 20px; text-align: center; border-radius: 50%; border: 2px solid var(--ink); }
  .pill { font-size: 20px; padding: 14px 34px; border: 3px solid var(--ink); border-radius: 999px; background: var(--yel); box-shadow: 0 5px 0 var(--ink); min-width: 230px; }
  .pill:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .pill.w { background: #fff; font-size: 16px; padding: 11px 28px; }
  #resHits { font-size: clamp(64px, 22vw, 120px); font-weight: 900; color: var(--yel); line-height: 1; text-shadow: 6px 7px 0 var(--red); margin: 0; }
  #resHits small { font-size: .32em; color: #fff; text-shadow: none; }
  #resRank { font-size: clamp(24px, 8vw, 38px); font-weight: 900; margin: 0; }
  #resStats { font-weight: 800; font-size: 15px; line-height: 1.9; margin: 0; }
  #resNew { color: #ff7ad1; font-weight: 900; font-size: 18px; margin: 0; animation: bump .5s ease-out infinite alternate; }
  #resBye { background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 16px; padding: 10px 14px; font-weight: 800; font-size: 14px; max-width: 420px; box-shadow: 0 4px 0 var(--ink); display: flex; gap: 10px; align-items: center; text-align: left; }
  #resBye img { width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--ink); object-fit: cover; flex: none; }
  #ready { background: none; pointer-events: none; }
  #ready .who { font-size: clamp(22px, 7vw, 36px); font-weight: 900; } #ready .rd { font-size: clamp(46px, 15vw, 90px); font-weight: 900; color: var(--yel); }
  #hint { position: fixed; left: 0; right: 0; bottom: 20%; text-align: center; font-weight: 900; font-size: 17px; pointer-events: none; animation: bump .5s ease-out infinite alternate; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="flash"></div>
<div id="hud" class="hidden">
  <div id="hudTop">
    <button id="btnPause" class="ibtn" type="button" aria-label="一時停止">⏸</button>
    <div id="timeWrap"><div id="timeBar"></div><div id="timeNum">60</div></div>
    <button id="btnMute" class="ibtn" type="button" aria-label="音">🔊</button>
  </div>
  <div id="hits" class="stroke">0<small>発</small></div>
  <div id="combo" class="stroke"></div>
  <div id="foe"><span id="foeName"></span><div id="gaugeWrap"><div id="gauge"></div></div></div>
</div>
<div id="pops"></div>
<div id="bubble"></div>
<div id="big" class="stroke"></div>
<div id="hint" class="stroke hidden">相手をタップして殴れ!</div>

<div id="select" class="overlay">
  <h1 class="logo stroke">殴られ屋</h1>
  <p class="sub">1分間、殴って殴って殴りまくれ!</p>
  <p class="note">相手は「殴られ屋」。よけるだけで、やり返してきません。<br>だれを殴る? 好きな相手をえらんでね。</p>
  <div id="grid"></div>
  <p class="note" style="margin-top:14px">※ 登場するのは全員、殴られるのが仕事のプロ(作り話)です。本物の人は殴らないでね。</p>
</div>
<div id="ready" class="overlay mid hidden"><div class="who stroke" id="readyWho"></div><div class="rd stroke" id="readyTxt">READY…</div></div>
<div id="pause" class="overlay mid hidden">
  <h1 class="logo stroke" style="font-size:44px">ひとやすみ</h1>
  <button id="btnResume" class="pill" type="button">つづける</button>
  <button id="btnQuit" class="pill w" type="button">相手をえらびなおす</button>
</div>
<div id="result" class="overlay mid hidden">
  <p id="resNew" class="hidden">★ 新記録! ★</p>
  <p id="resHits" class="stroke">0<small>発</small></p>
  <p id="resRank" class="stroke"></p>
  <p id="resStats"></p>
  <div id="resBye"><img id="resFace" alt=""><span id="resByeTxt"></span></div>
  <button id="btnAgain" class="pill" type="button">もういっかい殴る</button>
  <button id="btnBack" class="pill w" type="button">相手をえらぶ</button>
</div>
<div id="nogl" class="overlay mid hidden">
  <h1 class="logo stroke" style="font-size:44px">殴られ屋</h1>
  <p class="sub">ごめんなさい。この端末では、立体の画面が出せませんでした。</p>
  <p class="note">iPhone は iOS 16.4 以上で遊べます(設定 → 一般 → ソフトウェアアップデート)。<br>ほかのスマホは、Chrome などの新しいブラウザで開きなおしてみてください。</p>
</div>
<script>
'use strict';
// 古いブラウザなどで本体が動かなかったときは、おわびの画面を出す
window.__booted = false;
function noGo() { if (window.__booted) return; document.getElementById('select').classList.add('hidden'); document.getElementById('nogl').classList.remove('hidden'); }
window.addEventListener('error', function () { noGo(); });            // 本体が読めなかった(古い iPhone など)ら すぐ出す
window.addEventListener('load', function () { setTimeout(noGo, 6000); });
</script>
<script type="module" src="js/game.js"></script>
<script>
'use strict';
// LINE の中で開いたときだけ、1回だけ案内する(LINE の中は画面が小さく、ホーム画面にも入れられない)
(function () {
  var seenKey = 'nagurare-line-tip', seen = false;
  try { seen = localStorage.getItem(seenKey) === '1'; } catch (e) {}
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (!/\bLine\//i.test(navigator.userAgent) || standalone || seen) return;
  var bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:8px;right:8px;top:calc(64px + env(safe-area-inset-top,0px));z-index:99999;background:#fffaf0;color:#1b1430;border:3px solid #1b1430;border-radius:14px;padding:10px 40px 10px 12px;font:700 13px/1.5 system-ui,sans-serif';
  bar.textContent = 'LINEの中だと画面が小さめです。右下の「…」(または右上の︙)から「ブラウザで開く」を選ぶと、大きく遊べて、ホーム画面にも入れられます。';
  var x = document.createElement('button'); x.type = 'button'; x.setAttribute('aria-label', 'とじる'); x.textContent = '×';
  x.style.cssText = 'position:absolute;top:4px;right:6px;width:32px;height:32px;min-height:0;padding:0;border:0;border-radius:0;box-shadow:none;background:none;font:900 20px/1 system-ui;color:#1b1430;cursor:pointer';
  x.addEventListener('click', function () { try { localStorage.setItem(seenKey, '1'); } catch (e) {} bar.remove(); });
  bar.appendChild(x); addEventListener('load', function () { document.body.appendChild(bar); setTimeout(function () { try { localStorage.setItem(seenKey, '1'); } catch (e) {} bar.remove(); }, 8000); });   // 8秒で消す(遊ぶ画面の合図にかぶらないように。2026-11-14 daruma)
})();

// ホーム画面に入れられる(アプリのように開く)ための登録。file:// や 登録できない所では 何もしない
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
<script>
  // はじめの画面(Google Play 風: インストール / このまま遊ぶ)。install.js が出す。ホーム画面から開いたときは出ない
  window.INSTALL_GATE = { id: 'nagurare', name: '殴られ屋', icon: 'icon-192.png', tagline: '1分間、殴りまくる スッキリ3Dゲーム', desc: '1分間、とにかく殴りまくれ!よけるのがうまい10人の「殴られ屋」を、タップでボコボコにするスッキリ3Dゲーム。',
    points: ['相手は10人。よけ方も、倒れ方も、ぜんぶ違う', 'タップするだけ。グローブが飛び出して気持ちいい', 'ボスは、目しか見えない工場の女帝'], shots: ['shots/1.jpg', 'shots/2.jpg', 'shots/3.jpg', 'shots/4.jpg'], badges: ['無料', '広告なし', '登録なし'] };
</script>
<script src="install.js"></script>
</body>
</html>
